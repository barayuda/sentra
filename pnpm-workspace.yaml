packages:
  - 'packages/*'
  - 'apps/*'

# typescript-eslint@8.68.0's peer range (">=4.8.4 <6.1.0") predates TypeScript 7.
# Root `typescript` is pinned to 7.0.2 per M1 policy (see CLAUDE.md); downgrading
# it to satisfy this peer would contradict that policy. typescript-eslint's
# TS-syntax parsing is stable across this gap in practice, so the mismatch is
# accepted explicitly here rather than silenced globally via strict-peer-dependencies.
peerDependencyRules:
  allowedVersions:
    typescript: '7'

# The runtime fix for typescript-eslint's TS 7 guard lives in .pnpmfile.cjs
# (packageExtensions can't win here: `typescript` is already a peerDependency
# in these packages' own manifests, so pnpm resolves the ambient peer ahead
# of anything packageExtensions.dependencies injects for the same name — see
# the comment in .pnpmfile.cjs for the full explanation). The allowedVersions
# rule above still covers packages this hook doesn't touch, e.g.
# eslint-plugin-storybook's own unrelated @typescript-eslint/utils peer.
