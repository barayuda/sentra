name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: a push to a branch makes the previous
# run's result irrelevant, and CI minutes are not free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails rather than silently updating the lockfile, so a
      # dependency change must be committed deliberately. This is the supply-chain
      # control from spec §10.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Builds run before typecheck because @sentra/ui's stylesheet imports
      # @sentra/tokens' generated output, and vue-tsc resolves that import.
      - name: Build
        run: pnpm build

      - name: Check sourcemaps are emitted
        run: pnpm verify:sourcemaps

      - name: Check bundle sizes
        run: pnpm verify:bundle-size

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test tokens under Jest (ADR 0002)
        run: pnpm --filter @sentra/tokens test:jest

      - name: Build Storybook
        run: pnpm --filter @sentra/ui storybook:build

      - name: Upload Storybook build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  # Runs every story's play function in a real browser and fails on any
  # accessibility violation — the CI-blocking half of the a11y gate
  # (spec §9's "Accessibility … enforced in CI"). @storybook/addon-a11y plus
  # the `a11y: { test: 'error' }` preview parameter give the test runner
  # built-in a11y checks on Storybook 9+, so no axe-playwright hook file is
  # needed (that recipe is for Storybook 8 only, per the test-runner README).
  interactions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @sentra/ui exec playwright install --with-deps chromium

      - name: Build tokens and Storybook
        run: pnpm --filter @sentra/tokens build && pnpm --filter @sentra/ui storybook:build

      # The test runner assumes port 6006 by default; serving the static build
      # and waiting for it keeps this job independent of the `verify` job's
      # artifact upload, matching the @storybook/test-runner README's "Running
      # against locally built Storybooks in CI" recipe.
      # `pnpm --filter <pkg> exec` runs with cwd set to the package directory,
      # so the served path is relative to packages/ui, not the repo root.
      - name: Run interaction and a11y tests
        run: |
          pnpm --filter @sentra/ui exec http-server storybook-static --port 6006 --silent &
          pnpm --filter @sentra/ui exec wait-on tcp:6006
          pnpm --filter @sentra/ui test:interactions

  # Runs one happy path through the *built* storefront in a real browser. The
  # dev server is not exercised here on purpose: this job's value is proving the
  # production bundle, its code splitting, and the committed Service Worker all
  # work together, which a dev-server run cannot show.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @playwright/test is a direct devDependency of the storefront so its bin
      # is linked on a clean frozen install — pnpm does not link transitive
      # bins, which is what broke the interactions job when `playwright` was
      # only a transitive dependency.
      - name: Install Playwright browser
        run: pnpm --filter @sentra/storefront exec playwright install --with-deps chromium

      # sdk-commerce's build step generates the types the app imports, so the
      # workspace build must run before the app can be built by Playwright's
      # webServer command.
      - name: Build workspace packages
        run: pnpm build

      - name: Run E2E smoke tests
        run: pnpm --filter @sentra/storefront e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
          retention-days: 7

  # Proves the parts compose: a remote built by one Vite process, served from
  # a second origin, loaded by a third, shares one Vue instance and one
  # router. Unlike `e2e` above, this job drives three preview servers at once
  # (storefront, console, shell) — the federation boundary the standalone job
  # cannot exercise on its own.
  federation-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @sentra/shell exec playwright install --with-deps chromium

      # sdk-commerce generates types at build time and the shell's E2E config
      # builds all three apps itself, so the workspace packages must exist
      # first — same ordering constraint as the storefront's e2e job.
      - name: Build workspace packages
        run: pnpm build

      - name: Run federated E2E tests
        run: pnpm --filter @sentra/shell e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: federation-playwright-report
          path: apps/shell/playwright-report
          retention-days: 7

  # Proves the claim the proposal leads with: the reference implementation is
  # deletable. The examples are removed, the lockfile is regenerated, and the
  # platform must still build, typecheck, lint, test, and — the browser step
  # below — actually run. A base template whose examples cannot be removed
  # cleanly is not a template — it is a fork you inherit. Named risk area:
  # none; this is a maintainability gate.
  platform-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check every member declares a role
        run: node scripts/workspace.mjs --check

      - name: Delete the reference implementation
        run: node scripts/strip-reference.mjs

      # --no-frozen-lockfile is correct here and only here: removing workspace
      # members necessarily changes the lockfile, so the frozen check that
      # every other job relies on would fail by construction.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Everything above proves the stripped tree compiles; none of it loads a
      # page. This is the step that closed the gap a Critical finding shipped
      # through: a runtime-only module-resolution defect that every prior step
      # in this job was structurally unable to see. `VITE_SENTRA_MOCKS=true` is
      # the configuration that broke — see `e2e-platform-only/*.spec.ts`.
      - name: Install Playwright browser
        run: pnpm --filter @sentra/shell exec playwright install --with-deps chromium

      - name: Smoke-check the stripped shell boots in a browser
        run: pnpm --filter @sentra/shell e2e:platform-only

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-only-playwright-report
          path: apps/shell/playwright-report
          retention-days: 7
